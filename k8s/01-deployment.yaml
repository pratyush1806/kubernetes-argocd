apiVersion: apps/v1
kind: Deployment
metadata:
  name: python-app
  namespace: python-app
spec:
  replicas: 2

  selector:
    matchLabels:
      app: python-app

  template:
    metadata:
      labels:
        app: python-app

    spec:
      containers:
        - name: python-app
          image: prat1980/python-app:v1
          imagePullPolicy: Always

          ports:
            - containerPort: 8000

          env:
            - name: APP_VERSION
              value: "v1"
